name: CD Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Incrementar versión en README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NOW=$(date +"%Y-%m-%d %H:%M:%S")
          
          if grep -q "AppVersion-" README.md; then
            CURRENT_VER=$(grep -oP 'AppVersion-\K[0-9]+' README.md | tail -1)
            NEXT_VER=$((CURRENT_VER + 1))
            sed -i "s/AppVersion-$CURRENT_VER/AppVersion-$NEXT_VER ($NOW)/g" README.md
          else
            echo "AppVersion-1 ($NOW)" >> README.md
          fi

          git add README.md
          git commit -m "chore: incremento de versión a AppVersion-$NEXT_VER" || exit 0
          git pull origin main --rebase || true
          git push origin main

  validate-prod:
    needs: bump-version
    runs-on: self-hosted
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Validar PROD_TOKEN contra variable local
        run: |
          if [ "$LOCAL_PROD_TOKEN" == "${{ secrets.PROD_TOKEN }}" ]; then
            echo "Validación de PROD_TOKEN correcta."
          else
            echo "Error: LOCAL_PROD_TOKEN no coincide con PROD_TOKEN."
            exit 1
          fi